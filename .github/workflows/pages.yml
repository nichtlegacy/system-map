name: Deploy Pages

# Publishes the landing page and the live demo. The page prints the version
# from package.json, so a merged release PR redeploys it too.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'app/**'
      - 'components/**'
      - 'data/**'
      - 'public/**'
      - 'types/**'
      - 'scripts/build-site.sh'
      - 'next.config.ts'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, newest wins: the page is a snapshot of main, so an
# in-flight older build has nothing worth finishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # A Pages site is public even when the repository is not. Until the
    # repository itself goes public, this job skips instead of publishing.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build site and demo
        run: scripts/build-site.sh

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
