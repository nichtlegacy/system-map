name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      # Writes the release PR, the tag and the GitHub release.
      contents: write
      pull-requests: write
    steps:
      # Keeps CHANGELOG.md and package.json in step with the Conventional
      # Commits on main. It holds one release PR open and keeps adding to it;
      # merging that PR is what cuts the release.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    name: Publish release image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
